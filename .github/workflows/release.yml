name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish self-contained single file
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: >
          dotnet publish src/ExchangeEwsMcp -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${TAG#v} -o publish
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="exchange-ews-mcp-${TAG}-${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd publish && zip -qr "../$name.zip" .) && asset="$name.zip"
          else
            tar -czf "$name.tar.gz" -C publish . && asset="$name.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber
